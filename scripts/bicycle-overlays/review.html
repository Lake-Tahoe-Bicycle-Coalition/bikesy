<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Overlay Changes</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
      /* Layout: change list (added / removed / changed, accept or reject each group) beside a map of the selected stretch. */
      :root {
        --bg: #f5f7f6;
        --panel: #ffffff;
        --fg: #1b2624;
        --muted: #5d6b68;
        --line: #d8e0de;
        --accent: #1f6f5c;
        --added: #1e9e4a;
        --removed: #d23b3b;
        --changed: #d98c00;
        --accept: #1e7d3c;
        --reject: #8a3a3a;
        --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #111816;
          --panel: #18211f;
          --fg: #e4ece9;
          --muted: #95a6a1;
          --line: #2a3632;
          --accent: #5cc3a5;
          --added: #4cc775;
          --removed: #f06b6b;
          --changed: #f0ad33;
          --accept: #4cc775;
          --reject: #e08787;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #111816;
        --panel: #18211f;
        --fg: #e4ece9;
        --muted: #95a6a1;
        --line: #2a3632;
        --accent: #5cc3a5;
        --added: #4cc775;
        --removed: #f06b6b;
        --changed: #f0ad33;
        --accept: #4cc775;
        --reject: #e08787;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 var(--font-body);
        display: grid;
        grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
      }
      aside {
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100%;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }
      #map {
        height: 100%;
        min-width: 0;
      }
      header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
        display: grid;
        gap: 8px;
      }
      h1 {
        font-size: 17px;
        margin: 0;
      }
      .paths {
        font: 11px var(--font-mono);
        color: var(--muted);
        overflow-wrap: anywhere;
        white-space: pre-line;
      }
      .tally {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .tally button {
        text-align: left;
        border: 1px solid var(--line);
        border-left: 4px solid var(--t);
        border-radius: 6px;
        padding: 6px 8px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        font: inherit;
      }
      .tally button[aria-pressed='false'] {
        opacity: 0.45;
      }
      .tally b {
        display: block;
        font: 600 15px var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .tally span {
        font-size: 11px;
        color: var(--muted);
      }
      .t-added {
        --t: var(--added);
      }
      .t-removed {
        --t: var(--removed);
      }
      .t-changed {
        --t: var(--changed);
      }
      .t-mixed {
        --t: var(--muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .chip {
        font: 500 12px var(--font-body);
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        border-radius: 999px;
        padding: 3px 9px;
        cursor: pointer;
      }
      .chip[aria-pressed='true'] {
        background: var(--fg);
        color: var(--panel);
        border-color: var(--fg);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
      }
      kbd {
        font: 11px var(--font-mono);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 3px;
      }
      #list {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
      }
      .empty {
        padding: 24px 16px;
        color: var(--muted);
      }
      .item {
        border-bottom: 1px solid var(--line);
        border-left: 4px solid var(--t);
        padding: 8px 12px 8px 12px;
        display: grid;
        gap: 4px;
        cursor: pointer;
      }
      .item.sel {
        background: color-mix(in srgb, var(--t) 11%, transparent);
      }
      .item .top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: baseline;
      }
      .item .what {
        font-weight: 600;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .num {
        font: 12px var(--font-mono);
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        white-space: nowrap;
      }
      .item .sub {
        font-size: 12px;
        color: var(--muted);
      }
      .decide {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .decide button {
        font: 600 12px var(--font-body);
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        border-radius: 6px;
        padding: 3px 10px;
        cursor: pointer;
      }
      .decide {
        flex-wrap: wrap;
      }
      .decide button.acc[aria-pressed='true'] {
        background: var(--accept);
        border-color: var(--accept);
        color: #fff;
      }
      .decide button.rej[aria-pressed='true'] {
        background: var(--reject);
        border-color: var(--reject);
        color: #fff;
      }
      .decide .state.mixed {
        color: var(--fg);
      }
      .toggle {
        justify-self: start;
        font-size: 12px;
      }
      .members {
        display: grid;
        gap: 6px;
        margin-top: 2px;
      }
      .member {
        border-left: 3px solid var(--t);
        padding: 4px 8px;
        display: grid;
        gap: 4px;
        font-size: 12px;
        cursor: pointer;
      }
      .member .decide button {
        font-size: 11px;
        padding: 2px 7px;
      }
      .member.sel {
        background: color-mix(in srgb, var(--t) 14%, transparent);
      }
      .decide .state {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-left: auto;
      }
      .more {
        display: grid;
        gap: 6px;
        font-size: 12px;
        cursor: default;
      }
      .more .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      a,
      .linkish {
        color: var(--accent);
      }
      .linkish {
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        text-decoration: underline;
        cursor: pointer;
      }
      details summary {
        cursor: pointer;
        color: var(--accent);
      }
      .why {
        display: grid;
        gap: 8px;
        margin-top: 6px;
      }
      .why .way {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
      }
      .why .fac {
        font-size: 12px;
      }
      .why .off {
        color: var(--removed);
      }
      .why table {
        border-collapse: collapse;
        font: 11px var(--font-mono);
        margin-top: 4px;
      }
      .why td {
        padding: 1px 8px 1px 0;
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      textarea {
        width: 100%;
        font: 13px var(--font-body);
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
        min-height: 32px;
        resize: vertical;
      }
      .old-note {
        font-size: 12px;
        color: var(--reject);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 6em;
        overflow-y: auto;
      }
      .fix {
        display: grid;
        gap: 4px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
      }
      .fix input[type='text'] {
        font: 12px var(--font-mono);
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 8px;
        width: 100%;
      }
      .fix .ways {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        font: 12px var(--font-mono);
      }
      .fix .err {
        color: var(--removed);
        font-size: 12px;
      }
      #fixes summary {
        font-size: 12px;
      }
      #fixes .fixrow {
        font: 11px var(--font-mono);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        overflow-wrap: anywhere;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        padding: 8px 16px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .legend label {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        cursor: pointer;
      }
      .sw {
        width: 20px;
        height: 5px;
        border-radius: 2px;
        display: inline-block;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--fg);
        color: var(--panel);
        font: 600 13px var(--font-body);
        padding: 8px 14px;
        border-radius: 8px;
        z-index: 10;
      }
      #error {
        padding: 12px 16px;
        color: var(--removed);
      }
      @media (max-width: 760px) {
        body {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: 45vh minmax(0, 1fr);
        }
        #map {
          grid-row: 1;
          height: 45vh;
        }
        aside {
          grid-row: 2;
          height: auto;
          border-right: 0;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <header>
        <h1>Overlay changes</h1>
        <div class="paths" id="paths"></div>
        <div class="tally" id="tally"></div>
        <div class="row" id="statusFilter"></div>
        <details id="fixes"></details>
        <div class="hint">
          <kbd>j</kbd>/<kbd>k</kbd> next/previous · <kbd>a</kbd> accept ·
          <kbd>o</kbd> reject: fix in OSM · <kbd>g</kbd> reject: fix in the generator ·
          <kbd>u</kbd> undecide. Only accepted changes are applied; connected changes are
          grouped and decided together.
        </div>
      </header>
      <div id="error" hidden></div>
      <div id="list" role="list"></div>
      <div class="legend" id="legend"></div>
    </aside>
    <div id="map"></div>
    <div id="toast" role="status" hidden></div>
    <script>
      const LABEL = {
        I: 'Multi-use Path',
        II: 'Bike Lane',
        III: 'Bike Route',
        IV: 'Protected Bike Lane',
      };
      const CLASS_COLOR = { I: '#330066', II: '#660099', III: '#9933cc', IV: '#2a0047' };
      const TYPE = { added: 'Added', removed: 'Removed', changed: 'Changed' };
      const state = {
        types: new Set(Object.keys(TYPE)),
        status: 'undecided',
        selected: null, // group id
        sub: null, // change id of a member picked inside an expanded group
        open: new Set(), // expanded group ids
      };
      let GROUPS = [],
        GROUP_OF = new Map(), // change id or group id -> group
        DATA,
        D, // decisions.mjs, shared with the server
        decisions = {};
      const css = (n) =>
        getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );
      const km = (m) => (m >= 1000 ? `${(m / 1000).toFixed(2)} km` : `${m} m`);

      let toastTimer;
      function toast(text) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (t.hidden = true), 2000);
      }

      function headline(c) {
        if (c.type === 'added') return `${LABEL[c.after]} added`;
        if (c.type === 'removed') return `${LABEL[c.before]} removed`;
        return `${LABEL[c.before]} → ${LABEL[c.after]}`;
      }
      const short = (c) =>
        c.type === 'added'
          ? `${c.after} added`
          : c.type === 'removed'
            ? `${c.before} removed`
            : `${c.before}→${c.after}`;
      // "4 removed II, 3 II→III": most common first.
      function summary(g) {
        const counts = new Map();
        for (const c of g.members) counts.set(short(c), (counts.get(short(c)) ?? 0) + 1);
        return [...counts]
          .sort((a, b) => b[1] - a[1])
          .map(([k, n]) => `${n} ${k.replace(/^(\w+) (added|removed)$/, '$2 $1')}`)
          .join(', ');
      }
      const nameOf = (g) =>
        g.name ??
        g.members.flatMap((c) => c.ways).find((w) => w.name)?.name ??
        '(unnamed)';

      // Per change: undecided | recurring (rejected earlier, still present) | accept | reject:osm
      // | reject:generator.
      const status = (c) => {
        const d = decisions[c.id];
        if (D.isRecurring(d, DATA.changes.after)) return 'recurring';
        return d?.decision === 'reject'
          ? `reject:${d.reason}`
          : (d?.decision ?? 'undecided');
      };
      const isOpen = (c) => ['undecided', 'recurring'].includes(status(c));
      const REASON = { osm: 'OSM', generator: 'the generator' };
      const STATE = {
        accept: 'Accepted',
        'reject:osm': 'Rejected: fix in OSM',
        'reject:generator': 'Rejected: fix in the generator',
        recurring: 'Rejected earlier, still present',
        undecided: 'Undecided',
      };
      const stateText = (c) =>
        status(c) === 'recurring'
          ? `Rejected earlier (fix in ${REASON[decisions[c.id].reason]}) — still present`
          : STATE[status(c)];
      // One state for a group when its members agree, else 'mixed'.
      function groupState(g) {
        const all = new Set(g.members.map(status));
        return all.size === 1 ? [...all][0] : 'mixed';
      }
      function groupText(g) {
        const s = groupState(g);
        if (s === 'recurring') {
          const reasons = new Set(g.members.map((c) => decisions[c.id].reason));
          return `Rejected earlier (fix in ${[...reasons].map((r) => REASON[r]).join(' / ')}) — still present`;
        }
        if (s !== 'mixed') return STATE[s];
        const n = {};
        for (const c of g.members) n[status(c)] = (n[status(c)] ?? 0) + 1;
        return `Mixed: ${Object.entries(n)
          .map(
            ([k, v]) =>
              `${v} ${STATE[k].replace(/^R/, 'r').replace(/^A/, 'a').replace(/^U/, 'u')}`,
          )
          .join(', ')}`;
      }
      const osmMembers = (g) =>
        g.members.filter((c) => decisions[c.id]?.reason === 'osm');
      const fixTodo = (c) =>
        decisions[c.id]?.reason === 'osm' &&
        decisions[c.id].osm_fix?.status === 'todo' &&
        D.josmUrl(decisions[c.id].osm_fix) !== null;
      const matches = (g, k) =>
        k === 'all' ||
        (k === 'fixtodo' && g.members.some(fixTodo)) ||
        (k === 'undecided' && g.members.some(isOpen)) ||
        (k === 'recurring' && g.members.some((c) => status(c) === 'recurring')) ||
        (k === 'accept' &&
          !g.members.some(isOpen) &&
          g.members.some((c) => status(c) === 'accept')) ||
        (k === 'reject' &&
          !g.members.some(isOpen) &&
          g.members.some((c) => status(c).startsWith('reject')));

      function visible() {
        return GROUPS.filter(
          (g) =>
            g.members.some((c) => state.types.has(c.type)) && matches(g, state.status),
        );
      }

      function renderTally() {
        const el = document.getElementById('tally');
        el.innerHTML = '';
        for (const [type, label] of Object.entries(TYPE)) {
          const all = DATA.changes.changes.filter((c) => c.type === type);
          const done = all.filter((c) => !isOpen(c)).length;
          const b = document.createElement('button');
          b.className = `t-${type}`;
          b.setAttribute('aria-pressed', String(state.types.has(type)));
          b.innerHTML = `<b>${done}/${all.length}</b><span>${label} decided</span>`;
          b.addEventListener('click', () => {
            state.types.has(type) ? state.types.delete(type) : state.types.add(type);
            render();
          });
          el.append(b);
        }
      }

      const statusChips = {};
      for (const [k, label] of [
        ['undecided', 'Undecided'],
        ['recurring', 'Rejected earlier'],
        ['accept', 'Accepted'],
        ['reject', 'Rejected'],
        ['fixtodo', 'OSM fix to do'],
        ['all', 'All'],
      ]) {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = label;
        b.dataset.label = label;
        b.setAttribute('aria-pressed', String(k === state.status));
        b.addEventListener('click', () => {
          state.status = k;
          for (const [s, x] of Object.entries(statusChips))
            x.setAttribute('aria-pressed', String(s === k));
          render();
        });
        statusChips[k] = b;
        document.getElementById('statusFilter').append(b);
      }

      const store = (saved) => {
        for (const [id, d] of Object.entries(saved))
          if (d.decision || d.note || d.osm_fix) decisions[id] = d;
          else delete decisions[id];
      };
      // One request for all the changes (a group's members, or one change); null clears.
      async function save(ms, body) {
        const res = await fetch('/decisions', {
          method: 'PUT',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ ids: ms.map((c) => c.id), ...body }),
        });
        if (!res.ok) {
          const error = (await res.json().catch(() => null))?.error;
          return toast(error ?? 'Could not save. Is review.mjs still running?');
        }
        store(await res.json());
        return true;
      }

      // key: 'accept' | 'reject:osm' | 'reject:generator' | null (undecide).
      async function decide(g, ms, key) {
        const [decision, reason] = key ? key.split(':') : [null];
        if (!(await save(ms, { decision, reason, confirm: true }))) return;
        toast(key ? STATE[key] : 'Undecided');
        // Stay in place in the list: move to the next undecided group when filtering by Undecided.
        const list = visible();
        if (state.status === 'undecided' && key && !g.members.some(isOpen)) {
          const at = (x) => GROUPS.indexOf(x);
          const next =
            list.find((x) => x !== g && at(x) > at(g)) ?? list.find((x) => x !== g);
          state.selected = next?.id ?? null;
          state.sub = null;
          render();
          if (next) zoomTo(next);
        } else render();
      }
      const saveNote = (g, note) => save(g.members, { note });

      const fixOf = (g) => {
        const ms = osmMembers(g);
        const fixes = ms.map((c) => decisions[c.id].osm_fix).filter(Boolean);
        const ways = D.unionWays(ms);
        return fixes.length
          ? {
              tags: fixes.find((f) => f.tags)?.tags ?? '',
              ways: [...new Set(fixes.flatMap((f) => f.ways ?? []).map(Number))],
              status: fixes.some((f) => f.status === 'todo') ? 'todo' : fixes[0].status,
            }
          : { tags: '', ways: ways.slice(0, 1).map((w) => w.id), status: 'todo' };
      };
      const formFix = (form) => ({
        tags: form.querySelector('.tags').value.trim(),
        ways: [...form.querySelectorAll('.ways input:checked')].map((x) =>
          Number(x.value),
        ),
        status: form.querySelector('.fstatus').value,
      });
      async function saveFix(g, form) {
        const fix = formFix(form);
        const ms = osmMembers(g);
        if (!fix.tags && !ms.some((c) => decisions[c.id].osm_fix)) return;
        if (await save(ms, { osm_fix: fix.tags ? fix : null })) {
          toast(fix.tags ? 'Fix saved' : 'Fix removed');
          render();
        }
      }
      function showFix(form) {
        const fix = formFix(form);
        const { tags, error } = D.parseTags(fix.tags);
        form.querySelector('.err').textContent =
          error ?? (tags.length && !fix.ways.length ? 'Choose at least one way' : '');
        const josm = form.querySelector('.josm');
        const url = D.josmUrl(fix);
        josm.hidden = !url;
        if (url) josm.href = url;
      }

      // Fixes still to do, one line per group and tag set, with the union of the ways.
      function renderFixes() {
        const rows = [];
        for (const g of GROUPS) {
          const byTags = new Map();
          for (const c of g.members.filter(fixTodo)) {
            const fix = decisions[c.id].osm_fix;
            const row = byTags.get(fix.tags) ?? { g, tags: fix.tags, ways: new Set() };
            fix.ways.forEach((w) => row.ways.add(w));
            byTags.set(fix.tags, row);
          }
          rows.push(...byTags.values());
        }
        const el = document.getElementById('fixes');
        el.hidden = !rows.length;
        el.innerHTML = `<summary>${rows.length} OSM fix${rows.length === 1 ? '' : 'es'} to do</summary>`;
        for (const { g, tags, ways } of rows) {
          const row = document.createElement('div');
          row.className = 'fixrow';
          row.innerHTML = `<button class="linkish">${esc(nameOf(g))}</button> <span>${esc(tags)}</span> <a href="${esc(D.josmUrl({ tags, ways: [...ways] }))}">JOSM</a>`;
          row.querySelector('button').addEventListener('click', () => {
            state.status = 'all';
            for (const [s, x] of Object.entries(statusChips))
              x.setAttribute('aria-pressed', String(s === 'all'));
            select(g.id);
          });
          row.querySelector('a').addEventListener('click', josmClick);
          el.append(row);
        }
        for (const [k, b] of Object.entries(statusChips))
          if (k === 'fixtodo')
            b.textContent = `${b.dataset.label} (${GROUPS.filter((g) => g.members.some(fixTodo)).length})`;
      }
      // JOSM remote control answers on localhost; without it the link opens in a tab and fails.
      function josmClick(e) {
        e.preventDefault();
        fetch(e.currentTarget.href, { mode: 'no-cors' }).then(
          () => toast('Sent to JOSM'),
          () => toast('JOSM not reachable: start it with remote control enabled'),
        );
      }

      async function copyIds(ids) {
        const text = [...new Set(ids)].map((id) => `w${id}`).join(', ');
        try {
          await navigator.clipboard.writeText(text);
          toast(`Copied ${ids.length} way ID${ids.length === 1 ? '' : 's'}`);
        } catch {
          toast(text);
        }
      }

      async function renderWhy(ways, el) {
        if (!ways.length) {
          el.innerHTML = '<div class="hint">No OSM ways found along this stretch.</div>';
          return;
        }
        el.innerHTML = '<div class="hint">Loading…</div>';
        const parts = await Promise.all(
          ways.map(async (w) => {
            const info = await (await fetch(`/why/${w.id}`)).json();
            const head = `<a href="https://www.openstreetmap.org/way/${w.id}" target="_blank" rel="noopener">w${w.id}</a> ${esc(w.name ?? '(unnamed)')} <span class="num">${esc(w.highway ?? '')}${w.metres ? ` · ${w.metres} m along` : ''}</span>`;
            if (info.found === false)
              return `<div class="way">${head}<div class="fac">Not a candidate in this run: no bike tags the generator recognises.</div></div>`;
            const fac = info.facilities
              .map(
                (f) =>
                  `<div class="fac${f.eligible ? '' : ' off'}">${f.class ? `Class ${f.class}` : 'No class'} · ${esc(f.kind)} · ${esc(f.side)} · ${esc(f.surface)}${f.eligible ? '' : ' · withheld'} <span class="num">${esc((f.evidence ?? []).join(', '))}</span>${(f.warnings ?? []).length ? ` <span class="num">${esc(f.warnings.join(', '))}</span>` : ''}</div>`,
              )
              .join('');
            const rows = Object.entries(info.tags)
              .map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`)
              .join('');
            return `<div class="way">${head}${fac}${info.warnings.length ? `<div class="num">${esc(info.warnings.join(', '))}</div>` : ''}<table>${rows}</table></div>`;
          }),
        );
        el.innerHTML = parts.join('');
      }

      const BUTTONS = [
        ['accept', 'acc', 'Accept'],
        ['reject:osm', 'rej', 'Reject: fix in OSM'],
        ['reject:generator', 'rej', 'Reject: fix in the generator'],
      ];
      // Accept / reject buttons for some changes; `current` is their shared state or 'mixed'.
      function decideButtons(g, ms, current) {
        const el = document.createElement('div');
        el.className = 'decide';
        el.innerHTML = BUTTONS.map(
          ([key, cls, label]) =>
            `<button class="${cls}" data-key="${key}" aria-pressed="${current === key}">${label}</button>`,
        ).join('');
        for (const b of el.querySelectorAll('button'))
          b.addEventListener('click', (e) => {
            e.stopPropagation();
            decide(g, ms, current === b.dataset.key ? null : b.dataset.key); // recurring: confirms it again
          });
        return el;
      }

      function render() {
        renderTally();
        renderFixes();
        const list = document.getElementById('list');
        const items = visible();
        list.innerHTML = items.length
          ? ''
          : '<div class="empty">No changes match. Choose another status, or turn a type back on.</div>';
        for (const g of items) {
          const s = groupState(g);
          const many = g.members.length > 1;
          const types = new Set(g.members.map((c) => c.type));
          const row = document.createElement('div');
          row.className = `item t-${types.size === 1 ? [...types][0] : 'mixed'}${state.selected === g.id ? ' sel' : ''}`;
          row.setAttribute('role', 'listitem');
          row.tabIndex = 0;
          row.dataset.id = g.id;
          const notes = [
            ...new Set(
              g.members
                .filter((c) => status(c) === 'recurring' && decisions[c.id].note)
                .map((c) => decisions[c.id].note),
            ),
          ];
          row.innerHTML = `
      <div class="top"><span class="what">${many ? esc(nameOf(g)) : headline(g.members[0])}</span><span class="num">${km(g.metres)}</span></div>
      <div class="sub">${many ? `${esc(summary(g))} · ${g.members.length} changes` : esc(nameOf(g))}</div>`;
          const buttons = decideButtons(g, g.members, s);
          buttons.insertAdjacentHTML(
            'beforeend',
            `<span class="state${s === 'mixed' ? ' mixed' : ''}">${esc(groupText(g))}</span>`,
          );
          row.append(buttons);
          for (const note of notes)
            row.insertAdjacentHTML(
              'beforeend',
              `<div class="old-note">${esc(note)}</div>`,
            );
          if (many) {
            const open = state.open.has(g.id);
            const toggle = document.createElement('button');
            toggle.className = 'linkish toggle';
            toggle.setAttribute('aria-expanded', String(open));
            toggle.textContent = `${open ? '▾' : '▸'} ${open ? 'Hide' : 'Show'} ${g.members.length} changes`;
            toggle.addEventListener('click', (e) => {
              e.stopPropagation();
              open ? state.open.delete(g.id) : state.open.add(g.id);
              if (open && g.members.some((c) => c.id === state.sub)) state.sub = null;
              render();
            });
            row.append(toggle);
            if (open) {
              const members = document.createElement('div');
              members.className = 'members';
              for (const c of g.members) {
                const m = document.createElement('div');
                m.className = `member t-${c.type}${state.sub === c.id ? ' sel' : ''}`;
                m.innerHTML = `<div class="top"><span>${headline(c)}</span><span class="num">${km(c.metres)}</span></div>`;
                const b = decideButtons(g, [c], status(c));
                b.insertAdjacentHTML(
                  'beforeend',
                  `<span class="state">${esc(stateText(c))}</span>`,
                );
                m.append(b);
                m.addEventListener('click', (e) => {
                  e.stopPropagation();
                  state.selected = g.id;
                  state.sub = c.id;
                  render();
                  zoomTo(c);
                });
                members.append(m);
              }
              row.append(members);
            }
          }
          if (state.selected === g.id) {
            const more = document.createElement('div');
            more.className = 'more';
            const [w, south, e, n] = g.bbox;
            const [lng, lat] = [(w + e) / 2, (south + n) / 2];
            const ways = D.unionWays(g.members);
            const ms = osmMembers(g);
            const fixWays = D.unionWays(ms);
            const fix = fixOf(g);
            const noteSet = new Set(g.members.map((c) => decisions[c.id]?.note ?? ''));
            more.innerHTML = `
        <div class="links">
          <a href="https://www.openstreetmap.org/#map=18/${lat.toFixed(5)}/${lng.toFixed(5)}" target="_blank" rel="noopener">OSM map</a>
          <a href="https://www.openstreetmap.org/edit?editor=id#map=19/${lat.toFixed(5)}/${lng.toFixed(5)}" target="_blank" rel="noopener">Edit in iD</a>
          <a href="${esc(D.googleMapsUrl(g.coords))}" target="_blank" rel="noopener">Google Maps</a>
          ${ways.map((x) => `<a href="https://www.openstreetmap.org/way/${x.id}" target="_blank" rel="noopener">OpenStreetMap w${x.id}</a>`).join('')}
          ${ways.length ? `<button class="linkish copy">Copy ${ways.length} way ID${ways.length === 1 ? '' : 's'}</button>` : ''}
        </div>
        <textarea id="note" placeholder="${noteSet.size > 1 ? 'Members have different notes; typing replaces them' : 'Note (optional): for a generator reject, describe the rule fix'}">${noteSet.size > 1 ? '' : esc([...noteSet][0])}</textarea>
        ${
          ms.length && fixWays.length
            ? `<div class="fix">
          <label>OSM fix tags <input type="text" class="tags" placeholder="surface=dirt -cycleway" value="${esc(fix.tags)}" /></label>
          <div class="ways">${fixWays.map((x) => `<label><input type="checkbox" value="${x.id}"${fix.ways.includes(x.id) ? ' checked' : ''} />w${x.id}</label>`).join('')}</div>
          <div class="row"><select class="fstatus"><option value="todo"${fix.status === 'todo' ? ' selected' : ''}>To do</option><option value="uploaded"${fix.status === 'uploaded' ? ' selected' : ''}>Uploaded</option></select>
          <a class="josm" target="_blank" rel="noopener" hidden>Open in JOSM</a></div>
          <div class="err" role="alert"></div></div>`
            : ''
        }
        <details><summary>Why?</summary><div class="why"></div></details>`;
            more.addEventListener('click', (e) => e.stopPropagation());
            more
              .querySelector('.copy')
              ?.addEventListener('click', () => copyIds(ways.map((x) => x.id)));
            more
              .querySelector('textarea')
              .addEventListener('change', (e) => saveNote(g, e.target.value));
            const form = more.querySelector('.fix');
            if (form) {
              showFix(form);
              form.addEventListener('input', () => showFix(form));
              form.addEventListener('change', () => saveFix(g, form));
              form.querySelector('.josm').addEventListener('click', josmClick);
            }
            const details = more.querySelector('details');
            details.addEventListener('toggle', () => {
              if (details.open) renderWhy(ways, more.querySelector('.why'));
            });
            row.append(more);
          }
          row.addEventListener('click', () => select(g.id));
          list.append(row);
        }
        updateChangeLayer();
      }

      // id: a group's id, or any change in it.
      function select(id) {
        const g = GROUP_OF.get(id);
        state.selected = g.id;
        state.sub = null;
        render();
        zoomTo(g);
        document.querySelector('.item.sel')?.scrollIntoView({ block: 'nearest' });
      }

      // Keyboard triage.
      document.addEventListener('keydown', (e) => {
        if (
          e.target.closest('textarea, input, select') ||
          e.metaKey ||
          e.ctrlKey ||
          e.altKey
        )
          return;
        const items = visible();
        const i = items.findIndex((g) => g.id === state.selected);
        const current = items[i];
        const keys = { a: 'accept', o: 'reject:osm', g: 'reject:generator', u: null };
        if (e.key === 'j' || e.key === 'k') {
          const next =
            items[
              Math.max(0, Math.min(items.length - 1, i + (e.key === 'j' ? 1 : -1)))
            ] ?? items[0];
          if (next) select(next.id);
        } else if (current && e.key in keys)
          decide(current, current.members, keys[e.key]);
      });

      // ---- Map.
      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            osm: {
              type: 'raster',
              tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
              tileSize: 256,
              maxzoom: 19,
              attribution: '© OpenStreetMap contributors',
            },
            esri: {
              type: 'raster',
              tiles: [
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
              ],
              tileSize: 256,
              maxzoom: 19,
              attribution: 'Imagery © Esri, Maxar, Earthstar Geographics',
            },
          },
          layers: [
            {
              id: 'osm',
              type: 'raster',
              source: 'osm',
              paint: { 'raster-saturation': -0.6, 'raster-opacity': 0.85 },
            },
            {
              id: 'esri',
              type: 'raster',
              source: 'esri',
              layout: { visibility: 'none' },
            },
          ],
        },
        center: [0, 0],
        zoom: 1,
        hash: true,
      });
      map.addControl(new maplibregl.NavigationControl(), 'top-right');
      map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }), 'bottom-right');

      // A group (its bounding box) or a single change.
      const zoomTo = (c) => {
        const b = c.bbox
          ? new maplibregl.LngLatBounds([c.bbox[0], c.bbox[1]], [c.bbox[2], c.bbox[3]])
          : c.coords.reduce(
              (bb, p) => bb.extend(p),
              new maplibregl.LngLatBounds(c.coords[0], c.coords[0]),
            );
        map.fitBounds(b, {
          padding: 90,
          maxZoom: 17,
          duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 700,
        });
      };

      function updateChangeLayer() {
        const src = map.getSource('changes');
        if (!src) return;
        src.setData({
          type: 'FeatureCollection',
          features: DATA.changes.changes
            .filter((c) => state.types.has(c.type))
            .map((c) => ({
              type: 'Feature',
              geometry: {
                type: 'LineString',
                coordinates: c.coords.length > 1 ? c.coords : [c.coords[0], c.coords[0]],
              },
              properties: {
                id: c.id,
                type: c.type,
                sel: GROUP_OF.get(c.id).id === state.selected,
                sub: c.id === state.sub,
                decided: !isOpen(c),
              },
            })),
        });
      }

      const TOGGLES = [
        {
          id: 'before',
          label: 'Before',
          swatch: 'background:#f08c00;opacity:.6',
          on: true,
        },
        { id: 'after', label: 'After', swatch: `background:${CLASS_COLOR.II}`, on: true },
        { id: 'esri', label: 'Imagery', swatch: 'background:#4a5a3a', on: false },
      ];
      for (const t of TOGGLES) {
        const lab = document.createElement('label');
        lab.innerHTML = `<input type="checkbox" id="t-${t.id}" ${t.on ? 'checked' : ''}><span class="sw" style="${t.swatch}"></span>${t.label}`;
        lab.querySelector('input').addEventListener('change', (e) => {
          const ids =
            t.id === 'esri' ? ['esri'] : Object.keys(LABEL).map((k) => `${t.id}-${k}`);
          for (const id of ids)
            if (map.getLayer(id))
              map.setLayoutProperty(
                id,
                'visibility',
                e.target.checked ? 'visible' : 'none',
              );
        });
        document.getElementById('legend').append(lab);
      }
      const typeLegend = document.createElement('span');
      typeLegend.innerHTML = Object.entries(TYPE)
        .map(
          ([t, l]) => `<span class="sw" style="background:${css(`--${t}`)}"></span> ${l}`,
        )
        .join(' &nbsp;');
      document.getElementById('legend').append(typeLegend);

      async function load() {
        try {
          [DATA, decisions, D] = await Promise.all([
            (await fetch('/data')).json(),
            (await fetch('/decisions')).json(),
            import('/decisions.mjs'),
          ]);
        } catch (error) {
          const el = document.getElementById('error');
          el.hidden = false;
          el.textContent = 'Could not load changes. Start the page with review.mjs.';
          return;
        }
        document.getElementById('paths').textContent =
          `before ${DATA.changes.before}\nafter ${DATA.changes.after}`;
        GROUPS = D.groupChanges(DATA.changes.changes, DATA.changes.tolerance_m ?? 20);
        for (const g of GROUPS) {
          GROUP_OF.set(g.id, g);
          for (const c of g.members) GROUP_OF.set(c.id, g);
        }
        state.selected = visible()[0]?.id ?? null;
        render();
        const onLoad = () => {
          for (const k of Object.keys(LABEL)) {
            if (DATA.before[k]) {
              map.addSource(`before-${k}`, { type: 'geojson', data: DATA.before[k] });
              map.addLayer({
                id: `before-${k}`,
                type: 'line',
                source: `before-${k}`,
                layout: { 'line-cap': 'round', 'line-join': 'round' },
                paint: {
                  'line-color': '#f08c00',
                  'line-width': ['interpolate', ['linear'], ['zoom'], 10, 3, 16, 11],
                  'line-opacity': 0.4,
                },
              });
            }
          }
          for (const k of Object.keys(LABEL)) {
            if (DATA.after[k]) {
              map.addSource(`after-${k}`, { type: 'geojson', data: DATA.after[k] });
              map.addLayer({
                id: `after-${k}`,
                type: 'line',
                source: `after-${k}`,
                paint: {
                  'line-color': CLASS_COLOR[k],
                  'line-width': k === 'I' ? 1.5 : 2.5,
                  'line-gap-width': k === 'I' ? 2 : 0,
                  'line-dasharray': k === 'III' ? [3, 4] : [1, 0],
                },
              });
            }
          }
          map.addSource('changes', {
            type: 'geojson',
            data: { type: 'FeatureCollection', features: [] },
          });
          map.addLayer({
            id: 'changes',
            type: 'line',
            source: 'changes',
            layout: { 'line-cap': 'round' },
            paint: {
              'line-color': [
                'match',
                ['get', 'type'],
                'added',
                css('--added'),
                'removed',
                css('--removed'),
                css('--changed'),
              ],
              'line-width': ['case', ['get', 'sub'], 14, ['get', 'sel'], 10, 6],
              'line-opacity': [
                'case',
                ['get', 'sel'],
                0.95,
                ['get', 'decided'],
                0.25,
                0.7,
              ],
            },
          });
          map.on('click', 'changes', (e) => select(e.features[0].properties.id));
          map.on(
            'mouseenter',
            'changes',
            () => (map.getCanvas().style.cursor = 'pointer'),
          );
          map.on('mouseleave', 'changes', () => (map.getCanvas().style.cursor = ''));
          updateChangeLayer();
          if (!location.hash) {
            const all = DATA.changes.changes.flatMap((c) => c.coords);
            if (all.length)
              map.fitBounds(
                all.reduce(
                  (bb, p) => bb.extend(p),
                  new maplibregl.LngLatBounds(all[0], all[0]),
                ),
                { padding: 40, duration: 0 },
              );
          }
          const first = GROUP_OF.get(state.selected);
          if (first) zoomTo(first);
        };
        map.loaded() ? onLoad() : map.on('load', onLoad);
      }
      load();
    </script>
  </body>
</html>
